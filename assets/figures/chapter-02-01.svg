<svg viewBox="0 0 900 310" role="img" aria-labelledby="paradigm-title paradigm-desc" xmlns="http://www.w3.org/2000/svg">
<title id="paradigm-title">两阶段检测与 YOLO 单阶段预测的流程差异</title><desc id="paradigm-desc">左侧先产生候选区域，再进行区域分类与框回归；右侧共享图像特征后直接输出密集预测，并通过后处理得到检测结果。</desc>
<rect x="8" y="8" width="884" height="294" rx="18" fill="#f6fafb"/>
<text x="34" y="42" font-size="18" font-weight="700" fill="#24414a">两阶段检测</text>
<g transform="translate(28 66)">
<rect x="0" y="0" width="142" height="70" rx="10" fill="#e0ecee" stroke="#9bb7bc"/><text x="71" y="30" text-anchor="middle" font-size="15" fill="#24414a">输入图像</text><text x="71" y="51" text-anchor="middle" font-size="12" fill="#5c737a">image</text>
<path d="M148 35 H174" stroke="#54757c" stroke-width="2.5"/><path d="M169 29 L176 35 L169 41" fill="none" stroke="#54757c" stroke-width="2.5"/>
<rect x="182" y="0" width="142" height="70" rx="10" fill="#e7f0f6" stroke="#83a8bb"/><text x="253" y="30" text-anchor="middle" font-size="15" fill="#24414a">候选区域 RPN</text><text x="253" y="51" text-anchor="middle" font-size="12" fill="#5c737a">region proposals</text>
<path d="M330 35 H356" stroke="#54757c" stroke-width="2.5"/><path d="M351 29 L358 35 L351 41" fill="none" stroke="#54757c" stroke-width="2.5"/>
<rect x="364" y="0" width="142" height="70" rx="10" fill="#e7f0f6" stroke="#83a8bb"/><text x="435" y="30" text-anchor="middle" font-size="15" fill="#24414a">RoI 特征</text><text x="435" y="51" text-anchor="middle" font-size="12" fill="#5c737a">region features</text>
<path d="M512 35 H538" stroke="#54757c" stroke-width="2.5"/><path d="M533 29 L540 35 L533 41" fill="none" stroke="#54757c" stroke-width="2.5"/>
<rect x="546" y="0" width="142" height="70" rx="10" fill="#e7f0f6" stroke="#83a8bb"/><text x="617" y="30" text-anchor="middle" font-size="15" fill="#24414a">分类 + 框精修</text><text x="617" y="51" text-anchor="middle" font-size="12" fill="#5c737a">classification / box</text>
<path d="M694 35 H720" stroke="#54757c" stroke-width="2.5"/><path d="M715 29 L722 35 L715 41" fill="none" stroke="#54757c" stroke-width="2.5"/>
<rect x="728" y="0" width="118" height="70" rx="10" fill="#d9efeb" stroke="#6eaaa0"/><text x="787" y="40" text-anchor="middle" font-size="15" fill="#24414a">检测结果</text>
</g>
<path d="M28 165 H870" stroke="#d2e0e3" stroke-dasharray="5 6"/>
<text x="34" y="202" font-size="18" font-weight="700" fill="#087f8c">YOLO 单阶段检测</text>
<g transform="translate(28 222)">
<rect x="0" y="0" width="142" height="58" rx="10" fill="#e0ecee" stroke="#9bb7bc"/><text x="71" y="34" text-anchor="middle" font-size="15" fill="#24414a">输入图像</text>
<path d="M148 29 H174" stroke="#087f8c" stroke-width="2.5"/><path d="M169 23 L176 29 L169 35" fill="none" stroke="#087f8c" stroke-width="2.5"/>
<rect x="182" y="0" width="210" height="58" rx="10" fill="#dff1f0" stroke="#69a9a2"/><text x="287" y="25" text-anchor="middle" font-size="15" fill="#24414a">共享特征提取</text><text x="287" y="44" text-anchor="middle" font-size="12" fill="#5c737a">one feature backbone</text>
<path d="M398 29 H424" stroke="#087f8c" stroke-width="2.5"/><path d="M419 23 L426 29 L419 35" fill="none" stroke="#087f8c" stroke-width="2.5"/>
<rect x="432" y="0" width="210" height="58" rx="10" fill="#dff1f0" stroke="#69a9a2"/><text x="537" y="25" text-anchor="middle" font-size="15" fill="#24414a">密集框与类别预测</text><text x="537" y="44" text-anchor="middle" font-size="12" fill="#5c737a">boxes + scores</text>
<path d="M648 29 H674" stroke="#087f8c" stroke-width="2.5"/><path d="M669 23 L676 29 L669 35" fill="none" stroke="#087f8c" stroke-width="2.5"/>
