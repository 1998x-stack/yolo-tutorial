<svg viewBox="0 0 900 320" role="img" aria-labelledby="c08a-title c08a-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c08a-title">同一网格中心的三种锚框几何先验</title><desc id="c08a-desc">同一个网格位置放置接近正方形、竖长和横长的锚框，模型为不同形状分别预测偏移。页面下方提供可切换的目标长宽比。</desc>
<rect x="8" y="8" width="884" height="304" rx="18" fill="#f6fafb"/>
<g transform="translate(46 38)">
<rect x="0" y="0" width="282" height="244" rx="12" fill="#e9f1f2" stroke="#b0c8ca"/>
<path d="M47 0 V244 M94 0 V244 M141 0 V244 M188 0 V244 M235 0 V244 M0 40 H282 M0 80 H282 M0 120 H282 M0 160 H282 M0 200 H282" stroke="#c6d7d9" stroke-width="1.1"/>
<g transform="translate(-7 -25)">
<rect id="anchor-candidate-0" x="152" y="120" width="70" height="60" fill="none" stroke="#087f8c" stroke-width="4"/>
<rect id="anchor-candidate-1" x="157" y="75" width="60" height="150" fill="none" stroke="#c47b31" stroke-width="2" stroke-dasharray="6 5"/>
<rect id="anchor-candidate-2" x="112" y="120" width="150" height="60" fill="none" stroke="#6c5b91" stroke-width="2" stroke-dasharray="6 5"/>
<rect id="anchor-target-box" x="149" y="117" width="76" height="66" rx="4" fill="#3b7474" fill-opacity=".12" stroke="#192f38" stroke-width="3"/>
<circle cx="187" cy="150" r="4.5" fill="#192f38"/>
</g>
<text x="141" y="267" text-anchor="middle" fill="#24414a" font-size="14" font-weight="700">共享中心；不同 w × h</text>
</g>
<g transform="translate(375 62)">
<text x="0" y="3" fill="#24414a" font-size="18" font-weight="700">比对目标宽高</text>
<rect x="0" y="24" width="468" height="47" rx="9" fill="#e1f0ef" stroke="#9fc3c0"/>
<text x="18" y="54" fill="#24535a" font-size="16">① 方形先验</text><text x="270" y="54" fill="#24535a" font-size="15">70 × 60</text>
<rect x="0" y="82" width="468" height="47" rx="9" fill="#fff0df" stroke="#d5ad74"/>
<text x="18" y="112" fill="#754719" font-size="16">② 竖长先验</text><text x="270" y="112" fill="#754719" font-size="15">60 × 150</text>
<rect x="0" y="140" width="468" height="47" rx="9" fill="#eeeaf7" stroke="#c4b6d9"/>
<text x="18" y="170" fill="#57477b" font-size="16">③ 横长先验</text><text x="270" y="170" fill="#57477b" font-size="15">150 × 60</text>
<text x="0" y="218" fill="#5b7379" font-size="14">形状 IoU：将所有框中心对齐，只比较宽高</text>
</g>
</svg>
