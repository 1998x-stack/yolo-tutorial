<svg viewBox="0 0 900 240" role="img" aria-labelledby="c28-title c28-desc" xmlns="http://www.w3.org/2000/svg"><title id="c28-title">端到端检测项目的阶段与产物</title><desc id="c28-desc">项目依次经过契约、数据、基线训练、错误驱动迭代与导出交付五个阶段，每个阶段都产出可复核的物件而非口头结论。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><rect x="14" y="61" width="162" height="110" rx="14" fill="#dcebed" stroke="#86a8ae"/><text x="95" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">任务契约</text><text x="95" y="126" text-anchor="middle" font-size="13" fill="#405e67">类别 · 指标 · 预算</text><rect x="191" y="61" width="162" height="110" rx="14" fill="#e3f3ef" stroke="#86a8ae"/><text x="272" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">数据与划分</text><text x="272" y="126" text-anchor="middle" font-size="13" fill="#405e67">清单 + 校验</text><rect x="368" y="61" width="162" height="110" rx="14" fill="#fff0df" stroke="#86a8ae"/><text x="449" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">基线对照</text><text x="449" y="126" text-anchor="middle" font-size="13" fill="#405e67">固定配置 + 记录</text><rect x="545" y="61" width="162" height="110" rx="14" fill="#e9e5f5" stroke="#86a8ae"/><text x="626" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">迭代与验收</text><text x="626" y="126" text-anchor="middle" font-size="13" fill="#405e67">错误分解驱动</text><rect x="722" y="61" width="162" height="110" rx="14" fill="#deedf4" stroke="#86a8ae"/><text x="803" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">导出与交付</text><text x="803" y="126" text-anchor="middle" font-size="13" fill="#405e67">接口 + 双验收</text><path d="M179 116 H187" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M187 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M356 116 H364" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M364 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M533 116 H541" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M541 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M710 116 H718" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M718 116 l-6 -5 v10 z" fill="#087f8c"/><text x="450" y="199" text-anchor="middle" font-size="13" fill="#50666e">每个阶段产出可复核的物件；任何阶段变更都回溯到契约重新验收</text><text x="450" y="220" text-anchor="middle" font-size="12" fill="#6b7f86">教学示意 · 不代表任何具体项目</text></svg>