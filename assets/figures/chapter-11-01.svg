<svg viewBox="0 0 900 320" role="img" aria-labelledby="c11a-title c11a-desc" xmlns="http://www.w3.org/2000/svg"><title id="c11a-title">图像水平翻转和窗口裁剪时，标签与像素必须同步</title><desc id="c11a-desc">原始框向右翻转后，坐标从 x 为120到280移动到360到520；裁剪时的框需与保留窗口相交并转换到局部坐标。</desc>
<rect x="8" y="8" width="884" height="304" rx="18" fill="#f6fafb"/>
<g font-size="15" fill="#24414a" text-anchor="middle" font-weight="700"><text x="147" y="39">原始图像</text><text x="453" y="39">水平翻转</text><text x="756" y="39">窗口裁剪</text></g>
<rect x="30" y="57" width="235" height="174" rx="10" fill="#dcebed" stroke="#9bbdbd"/>
<rect x="335" y="57" width="235" height="174" rx="10" fill="#dcebed" stroke="#9bbdbd"/>
<rect x="639" y="57" width="235" height="174" rx="10" fill="#e5f3ef" stroke="#9bbdbd"/>
<g stroke="#087f8c" stroke-width="4" fill="#087f8c" fill-opacity=".12"><rect x="75" y="92" width="89" height="79" rx="3"/><rect x="452" y="92" width="89" height="79" rx="3"/><rect x="685" y="78" width="135" height="122" rx="3"/></g>
<g stroke="#b58d52" stroke-width="2" fill="none" stroke-dasharray="6 5"><rect x="663" y="88" width="165" height="120"/><path d="M683 88 V208 M663 151 H828"/></g>
<g fill="#56727a" font-size="13" text-anchor="middle"><text x="147" y="257">框：(120,80,280,240)</text><text x="452" y="257">框：(360,80,520,240)</text><text x="756" y="257">先求交集，再移动到局部原点</text></g>
<g stroke="#087f8c" fill="none" stroke-width="3"><path d="M270 150 H330 M322 143 L330 150 L322 157"/><path d="M575 150 H631 M623 143 L631 150 L623 157"/></g>
<text x="452" y="293" font-size="13" text-anchor="middle" fill="#5b7379">几何校正后的标签才与新图像语义一致；框宽高不得变为零</text>
</svg>
