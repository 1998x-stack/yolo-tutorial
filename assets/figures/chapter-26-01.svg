<svg viewBox="0 0 900 240" role="img" aria-labelledby="c26-title c26-desc" xmlns="http://www.w3.org/2000/svg"><title id="c26-title">开放词汇检测的文本嵌入路径</title><desc id="c26-desc">类别名称先经文本编码器得到文本嵌入（可离线预计算），再与视觉特征对齐，得到带名称的检测框；类名挺写直接影响结果。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><rect x="14" y="61" width="162" height="110" rx="14" fill="#dcebed" stroke="#86a8ae"/><text x="95" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">类别文本</text><text x="95" y="126" text-anchor="middle" font-size="13" fill="#405e67">自然语言名称</text><rect x="191" y="61" width="162" height="110" rx="14" fill="#e3f3ef" stroke="#86a8ae"/><text x="272" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">文本编码器</text><text x="272" y="126" text-anchor="middle" font-size="13" fill="#405e67">可离线运行</text><rect x="368" y="61" width="162" height="110" rx="14" fill="#fff0df" stroke="#86a8ae"/><text x="449" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">文本嵌入</text><text x="449" y="126" text-anchor="middle" font-size="13" fill="#405e67">预计算并缓存</text><rect x="545" y="61" width="162" height="110" rx="14" fill="#e9e5f5" stroke="#86a8ae"/><text x="626" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">视觉-文本对齐</text><text x="626" y="126" text-anchor="middle" font-size="13" fill="#405e67">相似度打分</text><rect x="722" y="61" width="162" height="110" rx="14" fill="#deedf4" stroke="#86a8ae"/><text x="803" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">检测输出</text><text x="803" y="126" text-anchor="middle" font-size="13" fill="#405e67">框 + 名称</text><path d="M179 116 H187" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M187 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M356 116 H364" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M364 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M533 116 H541" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M541 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M710 116 H718" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M718 116 l-6 -5 v10 z" fill="#087f8c"/><text x="450" y="199" text-anchor="middle" font-size="13" fill="#50666e">类名的抱写与语言会影响结果；文本嵌入可预先算好以降低在线开销</text><text x="450" y="220" text-anchor="middle" font-size="12" fill="#6b7f86">教学示意 · 具体架构依版本与实现而定</text></svg>