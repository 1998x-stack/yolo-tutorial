<rect x="56" y="65" width="84" height="62" rx="4" fill="none" stroke="#c47b31" stroke-width="3" stroke-dasharray="6 4"/>
<path d="M95 96 L120 83" stroke="#c47b31" stroke-width="2.5"/>
<text x="95" y="218" text-anchor="middle" font-size="16" fill="#24414a" font-weight="700">解码后的预测框</text>
</g>
</svg>
