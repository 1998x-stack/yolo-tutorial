<svg viewBox="0 0 900 300" role="img" aria-labelledby="anchor-title anchor-desc" xmlns="http://www.w3.org/2000/svg">
<title id="anchor-title">锚框先验与预测偏移</title><desc id="anchor-desc">同一特征网格位置预设多个不同长宽比的参考框，网络预测中心点偏移和宽高缩放量，得到最终检测框。</desc>
<rect x="8" y="8" width="884" height="284" rx="18" fill="#f6fafb"/>
<g transform="translate(48 32)">
<rect width="220" height="220" rx="12" fill="#eaf1f2" stroke="#b2c6c9"/>
<path d="M44 0 V220 M88 0 V220 M132 0 V220 M176 0 V220 M0 44 H220 M0 88 H220 M0 132 H220 M0 176 H220" stroke="#c4d3d5" stroke-width="1.2"/>
<circle cx="110" cy="110" r="4" fill="#087f8c"/>
<rect x="70" y="78" width="80" height="64" fill="#087f8c" opacity=".13" stroke="#087f8c" stroke-width="3"/>
<rect x="90" y="42" width="40" height="136" fill="#c47b31" opacity=".12" stroke="#c47b31" stroke-width="3"/>
<rect x="52" y="88" width="116" height="44" fill="#7c6aa6" opacity=".12" stroke="#7c6aa6" stroke-width="3"/>
<text x="110" y="247" text-anchor="middle" font-size="16" fill="#24414a" font-weight="700">同一位置的候选锚框</text>
</g>
<g transform="translate(330 54)">
<text x="0" y="0" font-size="18" font-weight="700" fill="#24414a">网络预测参数</text>
<rect x="0" y="20" width="220" height="48" rx="9" fill="#e2f0f0" stroke="#8ab8b7"/>
<text x="110" y="50" text-anchor="middle" font-size="16" fill="#24535a">tₓ, tᵧ：中心偏移</text>
<rect x="0" y="82" width="220" height="48" rx="9" fill="#fff0df" stroke="#d4a36b"/>
<text x="110" y="112" text-anchor="middle" font-size="16" fill="#754719">tᵥ, tₕ：宽高缩放</text>
<rect x="0" y="144" width="220" height="48" rx="9" fill="#eeeaf7" stroke="#b1a2cf"/>
<text x="110" y="174" text-anchor="middle" font-size="16" fill="#57477b">tₒ：objectness</text>
</g>
<path d="M570 150 H632" stroke="#087f8c" stroke-width="3"/><path d="M625 142 L635 150 L625 158" stroke="#087f8c" stroke-width="3" fill="none"/>
