<svg viewBox="0 0 900 312" role="img" aria-labelledby="c07arch-title c07arch-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c07arch-title">YOLOv4 由骨干、特征融合与检测头构成</title><desc id="c07arch-desc">输入首先经 CSPDarknet53 提取多尺度特征，深层经过 SPP，随后 PAN 式双向路径融合三尺度特征，最后三个 YOLO 检测头分别预测目标。</desc>
