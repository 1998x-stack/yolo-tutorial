<text x="276" y="80" text-anchor="middle" fill="#754719" font-size="13">多核池化</text>
<g fill="#a5773f" font-size="13" text-anchor="middle"><text x="276" y="116">5×5 / 9×9 / 13×13</text><text x="276" y="140">保留相同 H×W</text></g>
<path d="M351 84 H397" stroke="#087f8c" stroke-width="3"/><path d="M388 77 l10 7 -10 7" fill="none" stroke="#087f8c" stroke-width="3"/>
