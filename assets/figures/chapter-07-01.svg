<text x="76" y="59" text-anchor="middle" font-size="15" fill="#24414a">CSPDarknet53</text>
<path d="M20 83 H132" stroke="#b9d0d4"/>
<g font-size="13" fill="#5b7379" text-anchor="middle"><text x="76" y="106">1×1 / 3×3 卷积</text><text x="76" y="128">CSP 跨阶段部分连接</text><text x="76" y="150">分层特征 C3–C5</text></g>
<path d="M153 84 H199" stroke="#087f8c" stroke-width="3"/><path d="M190 77 l10 7 -10 7" fill="none" stroke="#087f8c" stroke-width="3"/>
