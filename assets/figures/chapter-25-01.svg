<svg viewBox="0 0 900 240" role="img" aria-labelledby="c25-title c25-desc" xmlns="http://www.w3.org/2000/svg"><title id="c25-title">PR 曲线与阈值工作点</title><desc id="c25-desc">横轴为召回率、纵轴为精确率；提高置信度阈值沿曲线向高精度移动，降低阈值向高召回移动，工作点选择取决于漏检与误报的相对代价。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><path d="M70 200 H420 V40" stroke="#86a8ae" stroke-width="2" fill="none"/><text x="240" y="226" text-anchor="middle" font-size="13" fill="#405e67">召回率 Recall →</text><text x="60" y="36" font-size="13" fill="#405e67">精确率 Precision ↑</text><path d="M70 200 C 170 90 280 62 420 50" stroke="#087f8c" stroke-width="3" fill="none"/><circle cx="270" cy="70" r="5" fill="#d98b3f"/><text x="276" y="66" font-size="13" fill="#8a5a1f">A 高精度工作点</text><circle cx="400" cy="140" r="5" fill="#7b5ea7"/><text x="300" y="133" font-size="13" fill="#5b4382">B 高召回工作点</text><text x="470" y="80" font-size="14" fill="#23404b">AP = PR 曲线下面积，与工作点无关</text><text x="470" y="112" font-size="14" fill="#23404b">阈值决定工作点：高精 vs 高召回的取舍</text><text x="470" y="144" font-size="14" fill="#23404b">F1 最高点只是一个常见默认，不是唯一目标</text><text x="470" y="176" font-size="13" fill="#6b7f86">曲线形状为教学示意，不代表任何模型</text></svg>