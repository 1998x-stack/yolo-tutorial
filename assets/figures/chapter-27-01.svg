<svg viewBox="0 0 900 240" role="img" aria-labelledby="c27-title c27-desc" xmlns="http://www.w3.org/2000/svg"><title id="c27-title">从行业需求到验收口径的契约链</title><desc id="c27-desc">行业需求依次被翻译为标签空间、工作点、部署约束与验收口径；每一层的取舍都会反过来影响模型与数据方案。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><rect x="14" y="61" width="162" height="110" rx="14" fill="#dcebed" stroke="#86a8ae"/><text x="95" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">行业需求</text><text x="95" y="126" text-anchor="middle" font-size="13" fill="#405e67">模糊的业务语言</text><rect x="191" y="61" width="162" height="110" rx="14" fill="#e3f3ef" stroke="#86a8ae"/><text x="272" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">标签空间</text><text x="272" y="126" text-anchor="middle" font-size="13" fill="#405e67">类别与边界</text><rect x="368" y="61" width="162" height="110" rx="14" fill="#fff0df" stroke="#86a8ae"/><text x="449" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">工作点</text><text x="449" y="126" text-anchor="middle" font-size="13" fill="#405e67">召回 / 精度取舍</text><rect x="545" y="61" width="162" height="110" rx="14" fill="#e9e5f5" stroke="#86a8ae"/><text x="626" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">部署约束</text><text x="626" y="126" text-anchor="middle" font-size="13" fill="#405e67">设备 · 延迟 · 功耗</text><rect x="722" y="61" width="162" height="110" rx="14" fill="#deedf4" stroke="#86a8ae"/><text x="803" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">验收口径</text><text x="803" y="126" text-anchor="middle" font-size="13" fill="#405e67">指标 + 划分</text><path d="M179 116 H187" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M187 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M356 116 H364" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M364 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M533 116 H541" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M541 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M710 116 H718" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M718 116 l-6 -5 v10 z" fill="#087f8c"/><text x="450" y="199" text-anchor="middle" font-size="13" fill="#50666e">契约的每一层都会反向约束数据与模型选择；变更任一层都需重新验收</text><text x="450" y="220" text-anchor="middle" font-size="12" fill="#6b7f86">教学示意 · 不代表任何具体项目</text></svg>