<svg viewBox="0 0 900 240" role="img" aria-labelledby="c23-title c23-desc" xmlns="http://www.w3.org/2000/svg"><title id="c23-title">VOC / COCO / YOLO 框坐标约定对比</title><desc id="c23-desc">同一个目标框在图像坐标系中可以用左下右上的绝对像素（VOC）、左上角加尺寸的绝对像素（COCO）、或中心点加尺寸的归一化值（YOLO）三种方式描述。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><rect x="40" y="44" width="360" height="156" rx="8" fill="#ffffff" stroke="#86a8ae"/><text x="46" y="38" font-size="13" fill="#50666e">图像坐标：原点在左上角，x 向右、y 向下</text><rect x="140" y="86" width="160" height="86" rx="6" fill="#fff0df" stroke="#d98b3f" stroke-width="2"/><circle cx="220" cy="129" r="4.5" fill="#087f8c"/><text x="228" y="124" font-size="13" fill="#087f8c">中心 (cx, cy)</text><text x="144" y="80" font-size="13" fill="#8a5a1f">(xmin, ymin)</text><text x="244" y="186" font-size="13" fill="#8a5a1f">(xmax, ymax)</text><path d="M140 200 H300" stroke="#405e67" stroke-width="2" fill="none"/><path d="M140 198 v4 M300 198 v4" stroke="#405e67" stroke-width="2"/><text x="206" y="216" text-anchor="middle" font-size="13" fill="#405e67">w</text><text x="470" y="70" font-size="14" fill="#23404b">VOC：xmin, ymin, xmax, ymax（绝对像素，左右上下）</text><text x="470" y="104" font-size="14" fill="#23404b">COCO：x, y, w, h（左上角 + 尺寸，绝对像素）</text><text x="470" y="138" font-size="14" fill="#23404b">YOLO：cx, cy, w, h（中心点 + 尺寸，除以图像宽高归一化）</text><text x="470" y="172" font-size="13" fill="#6b7f86">同一框在三种约定下的数值不同，转换前必须先确认约定</text></svg>