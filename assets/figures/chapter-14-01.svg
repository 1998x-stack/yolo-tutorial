<svg viewBox="0 0 900 330" role="img" aria-labelledby="c14a-title c14a-desc" xmlns="http://www.w3.org/2000/svg"><title id="c14a-title">NMS 在重叠框之间保留最高分候选</title><desc id="c14a-desc">A 与 B 均是同一类别且重叠严重，NMS 在默认阈值0.5时保留分数0.95的A并抑制0.88的B；另一目标C不重叠，另一类别的D可在逐类抑制中保留。</desc>
<rect x="8" y="8" width="884" height="314" rx="18" fill="#f6fafb"/>
<g fill="#24414a" font-size="17" font-weight="700" text-anchor="middle"><text x="208" y="41">NMS 前（四个候选）</text><text x="698" y="41">逐类别 NMS 后</text></g>
<g transform="translate(38 73)"><rect width="356" height="200" rx="12" fill="#e6eff1" stroke="#afc5ca"/><rect x="39" y="40" width="120" height="116" fill="#087f8c" fill-opacity=".12" stroke="#087f8c" stroke-width="4"/><rect x="53" y="52" width="120" height="116" fill="none" stroke="#c47b31" stroke-width="4" stroke-dasharray="6 5"/><rect x="233" y="35" width="98" height="124" fill="none" stroke="#6c5b91" stroke-width="4"/><rect x="43" y="44" width="120" height="116" fill="none" stroke="#327f59" stroke-width="3" stroke-dasharray="2 6"/><g font-size="13" fill="#24414a"><text x="42" y="29">A: cat .95</text><text x="147" y="182">B: cat .88</text><text x="230" y="27">C: cat .72</text><text x="22" y="191">D: dog .80</text></g></g>
<path d="M405 171 H489 M478 162 L489 171 L478 180" fill="none" stroke="#087f8c" stroke-width="3"/>
<g transform="translate(503 73)"><rect width="356" height="200" rx="12" fill="#e6eff1" stroke="#afc5ca"/><rect x="39" y="40" width="120" height="116" fill="#087f8c" fill-opacity=".12" stroke="#087f8c" stroke-width="4"/><rect x="233" y="35" width="98" height="124" fill="none" stroke="#6c5b91" stroke-width="4"/><rect x="43" y="44" width="120" height="116" fill="none" stroke="#327f59" stroke-width="3" stroke-dasharray="2 6"/><g font-size="13" fill="#24414a"><text x="42" y="29">A: cat .95</text><text x="230" y="27">C: cat .72</text><text x="22" y="191">D: dog .80</text></g></g>
<text x="452" y="307" text-anchor="middle" fill="#5b7379" font-size="14">A/B 同类 IoU≈0.681，阈值 0.5 时 B 被抑制；跨类 D 按类别单独处理</text>
</svg>
