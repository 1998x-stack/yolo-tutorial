<svg viewBox="0 0 900 324" role="img" aria-labelledby="c11b-title c11b-desc" xmlns="http://www.w3.org/2000/svg"><title id="c11b-title">四张原图与一张 Mosaic 画布之间的标注映射</title><desc id="c11b-desc">四个小输入图像分别通过缩放、平移、裁剪映射到同一画布的四个象限；框也经过相同几何运算，并去掉不可见区域。</desc>
<rect x="8" y="8" width="884" height="308" rx="18" fill="#f6fafb"/>
<g transform="translate(30 47)"><rect x="0" y="0" width="180" height="106" rx="8" fill="#dcebed" stroke="#8eb6b7"/><rect x="0" y="120" width="180" height="106" rx="8" fill="#eeeaf7" stroke="#ad9dc9"/><text x="90" y="61" font-size="16" text-anchor="middle" fill="#24414a">输入 1、2</text><text x="90" y="181" font-size="16" text-anchor="middle" fill="#57477b">输入 3、4</text></g>
<path d="M225 166 H335 M326 158 L336 166 L326 174" stroke="#087f8c" stroke-width="3" fill="none"/>
<g transform="translate(355 25)"><rect width="270" height="270" rx="12" fill="#e3eeee" stroke="#88adb3" stroke-width="2"/><rect x="0" y="0" width="122" height="142" fill="#cbe8e5"/><rect x="122" y="0" width="148" height="142" fill="#fff0df"/><rect x="0" y="142" width="122" height="128" fill="#e9e1f6"/><rect x="122" y="142" width="148" height="128" fill="#dcebdc"/><path d="M122 0 V270 M0 142 H270" stroke="#fff" stroke-width="5"/><rect x="42" y="44" width="64" height="70" fill="none" stroke="#087f8c" stroke-width="3"/><rect x="165" y="25" width="63" height="78" fill="none" stroke="#c47b31" stroke-width="3"/><rect x="28" y="181" width="79" height="62" fill="none" stroke="#6c5b91" stroke-width="3"/><rect x="175" y="183" width="66" height="66" fill="none" stroke="#327f59" stroke-width="3"/><text x="135" y="292" text-anchor="middle" fill="#24414a" font-size="14" font-weight="700">Mosaic 画布</text></g>
<g font-size="14" fill="#24414a"><text x="666" y="85">每块图像都执行：</text><text x="666" y="122">① 缩放与偏移</text><text x="666" y="151">② 边界框同步映射</text><text x="666" y="180">③ 裁剪到可见区域</text><text x="666" y="209">④ 过滤非法退化框</text></g>
</svg>
