<svg viewBox="0 0 900 240" role="img" aria-labelledby="c22-title c22-desc" xmlns="http://www.w3.org/2000/svg"><title id="c22-title">从模型到持续性能的约束链</title><desc id="c22-desc">名义算力经由算子支持、内存带宽与功耗散热逐层筛选，最终决定的才是设备可持续输出的 p95 延迟与能效；任一层成为瓶颈都会限制整体。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><rect x="14" y="61" width="162" height="110" rx="14" fill="#dcebed" stroke="#86a8ae"/><text x="95" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">模型与输入</text><text x="95" y="126" text-anchor="middle" font-size="13" fill="#405e67">640×640 · 精度</text><rect x="191" y="61" width="162" height="110" rx="14" fill="#e3f3ef" stroke="#86a8ae"/><text x="272" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">算子支持</text><text x="272" y="126" text-anchor="middle" font-size="13" fill="#405e67">是否回退 CPU</text><rect x="368" y="61" width="162" height="110" rx="14" fill="#fff0df" stroke="#86a8ae"/><text x="449" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">内存带宽</text><text x="449" y="126" text-anchor="middle" font-size="13" fill="#405e67">权重/激活搬运</text><rect x="545" y="61" width="162" height="110" rx="14" fill="#e9e5f5" stroke="#86a8ae"/><text x="626" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">功耗与散热</text><text x="626" y="126" text-anchor="middle" font-size="13" fill="#405e67">降频边界</text><rect x="722" y="61" width="162" height="110" rx="14" fill="#deedf4" stroke="#86a8ae"/><text x="803" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">持续吞吐</text><text x="803" y="126" text-anchor="middle" font-size="13" fill="#405e67">p95 延迟 · 能效</text><path d="M179 116 H187" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M187 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M356 116 H364" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M364 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M533 116 H541" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M541 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M710 116 H718" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M718 116 l-6 -5 v10 z" fill="#087f8c"/><text x="450" y="199" text-anchor="middle" font-size="13" fill="#50666e">每一层都可能成为瓶颈：算子回退、带宽上限或热降频都会拉低最终吞吐</text><text x="450" y="220" text-anchor="middle" font-size="12" fill="#6b7f86">教学示意 · 不含具体设备参数</text></svg>