<svg viewBox="0 0 900 310" role="img" aria-labelledby="c13a-title c13a-desc" xmlns="http://www.w3.org/2000/svg"><title id="c13a-title">Neck 与 Head 的数据职责</title><desc id="c13a-desc">Backbone 三尺度特征进入 Neck 融合，然后 Head 产生定位和分类预测。训练时匹配器连接预测与真实框构造损失；推理时预测经过解码和 NMS。</desc>
<rect x="8" y="8" width="884" height="294" rx="18" fill="#f6fafb"/>
<g fill="#24414a" text-anchor="middle" font-size="16" font-weight="700"><text x="110" y="53">Backbone</text><text x="350" y="53">Neck</text><text x="588" y="53">Head</text></g>
<g font-size="14" text-anchor="middle" fill="#24535a"><rect x="28" y="80" width="165" height="74" rx="11" fill="#dcebed" stroke="#92b9bd"/><text x="110" y="109">C3 / C4 / C5</text><text x="110" y="133">分辨率与语义不同</text><rect x="272" y="80" width="156" height="74" rx="11" fill="#e3f1ef" stroke="#82b6b2"/><text x="350" y="109">融合 + SPPF</text><text x="350" y="133">跨尺度传递信息</text><rect x="507" y="80" width="162" height="74" rx="11" fill="#fff0df" stroke="#d9b078"/><text x="588" y="109">分类 + 定位分支</text><text x="588" y="133">预测张量</text></g>
<g fill="none" stroke="#087f8c" stroke-width="3"><path d="M195 117 H270 M430 117 H505 M671 117 H755 V205 H677"/><path d="M588 158 V208 H505"/><path d="M588 160 V254 H505"/></g>
<g text-anchor="middle" font-size="14" fill="#754719"><rect x="317" y="182" width="190" height="51" rx="9" fill="#fff0df" stroke="#d7b279"/><text x="412" y="205">训练：匹配 + Loss</text><text x="412" y="222" font-size="12">GT 与预测构造监督</text><rect x="679" y="182" width="185" height="51" rx="9" fill="#e8eff7" stroke="#a4b9d6"/><text x="770" y="204">推理：解码 + NMS</text><text x="770" y="221" font-size="12">最终目标框列表</text></g>
<text x="446" y="281" text-anchor="middle" font-size="13" fill="#5b7379">训练的标签匹配器不是推理时必须执行的一层卷积</text>
</svg>
