<svg viewBox="0 0 900 240" role="img" aria-labelledby="c21-title c21-desc" xmlns="http://www.w3.org/2000/svg"><title id="c21-title">从训练权重到后端执行的推理流水线</title><desc id="c21-desc">导出、图优化、精度校准和后端执行依次作用于模型；预处理与后处理位于模型图之外，通常不计入前向耗时但计入端到端延迟。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><rect x="14" y="61" width="162" height="110" rx="14" fill="#dcebed" stroke="#86a8ae"/><text x="95" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">训练权重</text><text x="95" y="126" text-anchor="middle" font-size="13" fill="#405e67">动态图 / .pt</text><rect x="191" y="61" width="162" height="110" rx="14" fill="#e3f3ef" stroke="#86a8ae"/><text x="272" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">导出静态图</text><text x="272" y="126" text-anchor="middle" font-size="13" fill="#405e67">ONNX · opset</text><rect x="368" y="61" width="162" height="110" rx="14" fill="#fff0df" stroke="#86a8ae"/><text x="449" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">图优化</text><text x="449" y="126" text-anchor="middle" font-size="13" fill="#405e67">融合 / 折叠 / 复用</text><rect x="545" y="61" width="162" height="110" rx="14" fill="#e9e5f5" stroke="#86a8ae"/><text x="626" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">精度校准</text><text x="626" y="126" text-anchor="middle" font-size="13" fill="#405e67">FP16 / INT8</text><rect x="722" y="61" width="162" height="110" rx="14" fill="#deedf4" stroke="#86a8ae"/><text x="803" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">后端执行</text><text x="803" y="126" text-anchor="middle" font-size="13" fill="#405e67">引擎 / IR / runtime</text><path d="M179 116 H187" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M187 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M356 116 H364" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M364 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M533 116 H541" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M541 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M710 116 H718" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M718 116 l-6 -5 v10 z" fill="#087f8c"/><text x="450" y="199" text-anchor="middle" font-size="13" fill="#50666e">预处理（letterbox / 归一化）与后处理（解码 / NMS）在上述模型图之外</text><text x="450" y="220" text-anchor="middle" font-size="12" fill="#6b7f86">教学示意 · 实际可用优化取决于后端与版本</text></svg>