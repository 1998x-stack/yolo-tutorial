<svg viewBox="0 0 900 254" role="img" aria-labelledby="c06b-title c06b-desc" xmlns="http://www.w3.org/2000/svg">
<title id="c06b-title">三个尺度的候选框到逐类别 NMS</title><desc id="c06b-desc">13平方、26平方、52平方网格各乘以三个框汇总为10647个候选，经过置信度与类别分数筛选，再按类别进行NMS，输出最终目标框。</desc>
<rect x="8" y="8" width="884" height="238" rx="16" fill="#f6fafb"/>
<g fill="#e4f2f1" stroke="#89bcb7">
<rect x="34" y="36" width="175" height="54" rx="9"/><rect x="34" y="103" width="175" height="54" rx="9"/><rect x="34" y="170" width="175" height="54" rx="9"/>
</g>
<g fill="#24414a" font-size="16" text-anchor="middle"><text x="121" y="69">13² × 3 = 507</text><text x="121" y="136">26² × 3 = 2,028</text><text x="121" y="203">52² × 3 = 8,112</text></g>
<path d="M212 65 H255 V130 H286 M212 130 H286 M212 197 H255 V130" fill="none" stroke="#087f8c" stroke-width="2.5"/>
<rect x="290" y="98" width="170" height="65" rx="10" fill="#fff1df" stroke="#d5a36d"/><text x="375" y="122" text-anchor="middle" fill="#754719" font-size="16" font-weight="700">10,647 个候选</text><text x="375" y="144" text-anchor="middle" fill="#754719" font-size="13">不是最终检测数</text>
<path d="M462 130 H502" stroke="#087f8c" stroke-width="2.5"/><path d="M494 123 L503 130 L494 137" stroke="#087f8c" stroke-width="2.5" fill="none"/>
<rect x="506" y="98" width="166" height="65" rx="10" fill="#dff0f0" stroke="#82b9b4"/><text x="589" y="122" text-anchor="middle" fill="#24535a" font-size="15">objectness × class</text><text x="589" y="144" text-anchor="middle" fill="#24535a" font-size="13">阈值与分类</text>
<path d="M674 130 H714" stroke="#087f8c" stroke-width="2.5"/><path d="M706 123 L715 130 L706 137" stroke="#087f8c" stroke-width="2.5" fill="none"/>
<rect x="718" y="98" width="151" height="65" rx="10" fill="#d9efeb" stroke="#72aaa0"/><text x="793" y="123" text-anchor="middle" fill="#24414a" font-size="15" font-weight="700">逐类别 NMS</text><text x="793" y="144" text-anchor="middle" fill="#56727a" font-size="13">最终框和分数</text>
</svg>
