<svg viewBox="0 0 900 240" role="img" aria-labelledby="c24-title c24-desc" xmlns="http://www.w3.org/2000/svg"><title id="c24-title">检测训练循环的主要环节</title><desc id="c24-desc">训练循环依次经过数据加载与增强、前向计算与损失、反向传播与优化器更新，并周期性进入验证与检查点保存；每一环节的配置都参与最终结果。</desc><rect x="2" y="3" width="896" height="231" rx="18" fill="#f6fafb"/><rect x="14" y="61" width="162" height="110" rx="14" fill="#dcebed" stroke="#86a8ae"/><text x="95" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">数据加载</text><text x="95" y="126" text-anchor="middle" font-size="13" fill="#405e67">workers + 增强</text><rect x="191" y="61" width="162" height="110" rx="14" fill="#e3f3ef" stroke="#86a8ae"/><text x="272" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">前向与损失</text><text x="272" y="126" text-anchor="middle" font-size="13" fill="#405e67">box / cls / dfl</text><rect x="368" y="61" width="162" height="110" rx="14" fill="#fff0df" stroke="#86a8ae"/><text x="449" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">反向与优化</text><text x="449" y="126" text-anchor="middle" font-size="13" fill="#405e67">AMP · 调度器</text><rect x="545" y="61" width="162" height="110" rx="14" fill="#e9e5f5" stroke="#86a8ae"/><text x="626" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">验证</text><text x="626" y="126" text-anchor="middle" font-size="13" fill="#405e67">mAP / loss</text><rect x="722" y="61" width="162" height="110" rx="14" fill="#deedf4" stroke="#86a8ae"/><text x="803" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#23404b">检查点</text><text x="803" y="126" text-anchor="middle" font-size="13" fill="#405e67">last / best</text><path d="M179 116 H187" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M187 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M356 116 H364" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M364 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M533 116 H541" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M541 116 l-6 -5 v10 z" fill="#087f8c"/><path d="M710 116 H718" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M718 116 l-6 -5 v10 z" fill="#087f8c"/><text x="450" y="199" text-anchor="middle" font-size="13" fill="#50666e">验证与检查点周期性执行；“最佳”权重的判据本身也是必须记录的配置项</text><text x="450" y="220" text-anchor="middle" font-size="12" fill="#6b7f86">教学示意 · 具体损失项与命名依版本而定</text></svg>