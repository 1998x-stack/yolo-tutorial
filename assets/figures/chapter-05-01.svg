<svg viewBox="0 0 900 340" role="img" aria-labelledby="pyramid-title pyramid-desc" xmlns="http://www.w3.org/2000/svg">
<title id="pyramid-title">YOLOv3 三尺度特征融合与预测</title><desc id="pyramid-desc">Darknet-53 输出 13、26、52 三种尺寸的特征。深层特征先预测，再上采样并与中层、浅层特征拼接，形成三个检测尺度。</desc>
<rect x="8" y="8" width="884" height="324" rx="18" fill="#f6fafb"/>
<g transform="translate(32 40)">
<rect x="0" y="0" width="168" height="54" rx="9" fill="#e5eef2" stroke="#9bb7bc"/><text x="84" y="22" text-anchor="middle" font-size="15" fill="#24414a">Darknet-53</text><text x="84" y="42" text-anchor="middle" font-size="12" fill="#5c737a">共享骨干</text>
<path d="M84 56 V92 M84 92 H26 V120 M84 92 V120 M84 92 H142 V120" fill="none" stroke="#8ca8ae" stroke-width="2"/>
<rect x="0" y="120" width="54" height="54" rx="7" fill="#e4f0ef" stroke="#78aaa2"/><text x="27" y="152" text-anchor="middle" font-size="13" fill="#24535a">52²</text>
<rect x="57" y="120" width="54" height="54" rx="7" fill="#e4f0ef" stroke="#78aaa2"/><text x="84" y="152" text-anchor="middle" font-size="13" fill="#24535a">26²</text>
<rect x="114" y="120" width="54" height="54" rx="7" fill="#e4f0ef" stroke="#78aaa2"/><text x="141" y="152" text-anchor="middle" font-size="13" fill="#24535a">13²</text>
<text x="84" y="198" text-anchor="middle" font-size="13" fill="#5c737a">步长 8 / 16 / 32</text>
</g>
<g transform="translate(252 45)">
<rect x="0" y="0" width="172" height="62" rx="9" fill="#fff0df" stroke="#d4a36b"/><text x="86" y="25" text-anchor="middle" font-size="15" fill="#754719">13×13 深层特征</text><text x="86" y="46" text-anchor="middle" font-size="12" fill="#8a643b">语义强</text>
<path d="M86 64 V94" stroke="#c47b31" stroke-width="2.5"/><path d="M79 87 L86 96 L93 87" fill="none" stroke="#c47b31" stroke-width="2.5"/>
<rect x="0" y="100" width="172" height="54" rx="9" fill="#e4f0ef" stroke="#78aaa2"/><text x="86" y="132" text-anchor="middle" font-size="15" fill="#24535a">预测尺度 P5</text>
<path d="M172 127 H205" stroke="#087f8c" stroke-width="2.5"/><path d="M198 120 L207 127 L198 134" fill="none" stroke="#087f8c" stroke-width="2.5"/>
<rect x="212" y="100" width="172" height="54" rx="9" fill="#e5eef2" stroke="#9bb7bc"/><text x="298" y="132" text-anchor="middle" font-size="15" fill="#24414a">13→26 上采样 + 拼接</text>
<path d="M298 156 V188" stroke="#087f8c" stroke-width="2.5"/><path d="M291 181 L298 190 L305 181" fill="none" stroke="#087f8c" stroke-width="2.5"/>
<rect x="212" y="196" width="172" height="54" rx="9" fill="#e4f0ef" stroke="#78aaa2"/><text x="298" y="228" text-anchor="middle" font-size="15" fill="#24535a">预测尺度 P4</text>
<path d="M384 223 H415" stroke="#087f8c" stroke-width="2.5"/><path d="M408 216 L417 223 L408 230" fill="none" stroke="#087f8c" stroke-width="2.5"/>
<rect x="422" y="196" width="172" height="54" rx="9" fill="#e5eef2" stroke="#9bb7bc"/><text x="508" y="228" text-anchor="middle" font-size="15" fill="#24414a">26→52 上采样 + 拼接</text>
<path d="M508 252 V282" stroke="#087f8c" stroke-width="2.5"/><path d="M501 275 L508 284 L515 275" fill="none" stroke="#087f8c" stroke-width="2.5"/>
<rect x="422" y="288" width="172" height="32" rx="8" fill="#e4f0ef" stroke="#78aaa2"/><text x="508" y="309" text-anchor="middle" font-size="14" fill="#24535a">预测尺度 P3</text>
</g>
<g transform="translate(690 74)">
<rect x="0" y="0" width="160" height="54" rx="9" fill="#e4f0ef" stroke="#78aaa2"/><text x="80" y="23" text-anchor="middle" font-size="15" fill="#24535a">13×13</text><text x="80" y="42" text-anchor="middle" font-size="12" fill="#5c737a">大尺度目标</text>
<rect x="0" y="82" width="160" height="54" rx="9" fill="#e4f0ef" stroke="#78aaa2"/><text x="80" y="105" text-anchor="middle" font-size="15" fill="#24535a">26×26</text><text x="80" y="124" text-anchor="middle" font-size="12" fill="#5c737a">中尺度目标</text>
<rect x="0" y="164" width="160" height="54" rx="9" fill="#e4f0ef" stroke="#78aaa2"/><text x="80" y="187" text-anchor="middle" font-size="15" fill="#24535a">52×52</text><text x="80" y="206" text-anchor="middle" font-size="12" fill="#5c737a">小尺度目标</text>
</g>
</svg>
